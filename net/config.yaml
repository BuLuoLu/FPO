# Component settings; supply your own data paths.
# No training, inference, or experiment entry is provided.
data:
  image_dir: "data/images"
  label_dir: "data/annotations"


  image_size: [1024, 1024]
  heatmap_downsample_factor: 4

  sigma_major: 17
  sigma_minor: 4

  use_augmentation: true

model:
  backbone: 'resnet50'
  pretrained: false
  pretrained_path: null

  use_deformable: true
  use_attention: true
  use_elongated: true
  use_gate: true

loss:
  heatmap_weight: 1.0
  direction_weight: 0.1
  unit_weight: 0.1
  angle_weight: 0.1
  offset_weight: 1.0

  focal_alpha: 0.75
  focal_beta: 2.0
